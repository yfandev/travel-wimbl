name: You.com API smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  youcom-smoke-test:
    name: Verify Wimbl You.com integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
      YOU_SEARCH_ENDPOINT: https://ydc-index.io/v1/search
      WIMBL_DEMO_MODE: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Confirm secret is configured
        shell: bash
        run: |
          if [ -z "$YOU_API_KEY" ]; then
            echo "::error::Repository secret YOU_API_KEY is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "YOU_API_KEY is configured (value hidden)."
      - name: Exercise Wimbl YouSearch adapter
        run: python scripts/check_youcom.py
