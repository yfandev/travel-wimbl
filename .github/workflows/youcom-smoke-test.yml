name: You.com API smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  youcom-smoke-test:
    name: Verify You.com credentials and search response
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
      YOU_SEARCH_ENDPOINT: https://ydc-index.io/v1/search
    steps:
      - name: Confirm secret is configured
        shell: bash
        run: |
          if [ -z "$YOU_API_KEY" ]; then
            echo "::error::Repository secret YOU_API_KEY is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "YOU_API_KEY is configured (value hidden)."
      - name: Call You.com Web Search API
        shell: python
        run: |
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          endpoint = os.environ["YOU_SEARCH_ENDPOINT"]
          request = urllib.request.Request(
              endpoint,
              data=json.dumps({"query": "official tennis tournament dates", "count": 3}).encode(),
              headers={
                  "X-API-Key": os.environ["YOU_API_KEY"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              print(f"::error::You.com API returned HTTP {exc.code}. Check key validity and API product access.")
              sys.exit(1)
          except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as exc:
              print(f"::error::You.com API request failed ({type(exc).__name__}).")
              sys.exit(1)

          results = payload.get("results", {})
          web_results = results.get("web", []) if isinstance(results, dict) else []
          news_results = results.get("news", []) if isinstance(results, dict) else []
          items = web_results or news_results
          if not items:
              print("::error::API request succeeded, but no web/news results were found in the response.")
              sys.exit(1)

          print(f"SUCCESS: You.com API returned {len(items)} result(s).")
          for item in items[:3]:
              title = item.get("title") or "(untitled result)"
              url = item.get("url") or item.get("link") or ""
              print(f"- {title}: {url}")
